<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>CSS Exec Portal</title>
  <script>try { var t = localStorage.getItem("css_theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="icon" href="assets/css-logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css?v=1.2.0">
  <link rel="stylesheet" href="theme.css?v=0.9.9">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.8a3.5 3.5 0 010 6.4M18 14.8c2 .6 3.2 2.3 3.5 5.2"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
    <symbol id="i-card" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h4"/></symbol>
    <symbol id="i-scan" viewBox="0 0 24 24"><path d="M4 8V5.5A1.5 1.5 0 015.5 4H8M16 4h2.5A1.5 1.5 0 0120 5.5V8M20 16v2.5a1.5 1.5 0 01-1.5 1.5H16M8 20H5.5A1.5 1.5 0 014 18.5V16M7 12h10"/></symbol>
    <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l2.5-7 5 14L17 12h4"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3L12 4zM12 10v4M12 17.2v.1"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  </defs></svg>
  <div id="demo-banner" class="demo-banner" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="connection-notice" class="connection-notice" role="status" hidden></div>

  <!-- Sign-in -->
  <main id="login-view" class="login" hidden>
    <form id="login-form" class="card login-card" autocomplete="off">
      <img class="login-logo" src="assets/css-logo.png" alt="Chinese Students' Society">
      <h1 data-t="appTitle"></h1>
      <p class="muted" data-t="appSubtitle"></p>

      <label for="name-input" data-t="nameLabel"></label>
      <input id="name-input" type="text" autocomplete="username" required>

      <label for="password" data-t="passwordLabel"></label>
      <input id="password" type="password" autocomplete="current-password" required>

      <p id="login-error" class="error" role="alert" hidden></p>
      <button id="login-button" type="submit" class="primary" data-t="signIn"></button>
      <button id="door-login-button" type="button" class="secondary" data-t="doorSignIn" hidden></button>
    </form>
  </main>

  <!-- Portal -->
  <div id="app-view" hidden>
    <!-- Left sidebar: brand, navigation, who is signed in -->
    <aside class="sidebar" id="sidebar">
      <div class="brand-block">
        <img class="logo" src="assets/css-logo.png" alt="Chinese Students' Society">
        <div class="brand-text"><div class="brand" id="brand" data-t="appTitle"></div><span class="tagline">CONNECT ~ CULTURE ~ SOCIAL</span></div>
      </div>
      <nav class="tabs" aria-label="Main">
        <button class="tab active" data-tab="overview"><svg><use href="#i-home"/></svg><span data-t="tabOverview"></span></button>
        <button class="tab" data-tab="members"><svg><use href="#i-users"/></svg><span data-t="tabMembers"></span><span id="mem-nav-count" class="nav-pill" hidden></span></button>
        <button class="tab" data-tab="events"><svg><use href="#i-cal"/></svg><span data-t="tabEvents"></span></button>
        <button class="tab" data-tab="payments"><svg><use href="#i-card"/></svg><span data-t="tabPayments"></span><span id="pay-nav-count" class="nav-pill" hidden></span></button>
        <button class="tab" data-tab="door"><svg><use href="#i-scan"/></svg><span data-t="tabDoor"></span><span id="door-nav-live" class="nav-live" hidden></span></button>
        <div class="nav-label" id="admin-nav-label" hidden>Admin</div>
        <button class="tab" id="activity-tab-button" data-tab="activity" hidden><svg><use href="#i-pulse"/></svg><span data-t="tabActivity"></span></button>
        <button class="tab" id="settings-tab-button" data-tab="settings" hidden><svg><use href="#i-gear"/></svg><span data-t="tabSettings"></span></button>
      </nav>
      <div class="who">
        <div class="avatar" id="who-avatar" aria-hidden="true"></div>
        <div class="who-text">
          <strong id="who-name"></strong>
          <span class="who-role"><span class="muted" data-t="signedInAs"></span> <span id="admin-badge" class="pill good" data-t="roleAdmin" hidden></span></span>
          <span class="who-links"><a id="full-portal-link" class="link" href="?full=1" data-t="fullPortal" hidden></a><button id="logout-button" class="link" data-t="signOut"></button></span>
        </div>
        <button id="admin-gear" class="icon-btn" type="button" title="Admin mode" aria-label="Admin mode"><svg><use href="#i-gear"/></svg></button>
        <button id="theme-toggle" class="icon-btn" type="button" title="Light / dark" aria-label="Switch between light and dark"><svg><use href="#i-moon"/></svg></button>
      </div>
    </aside>

    <div class="mainwrap">
    <header class="topbar">
      <button id="nav-burger" class="burger" type="button" aria-label="Menu"><svg><use href="#i-menu"/></svg></button>
      <div class="crumb"><span class="crumb-root">CSS</span> / <b id="crumb"></b></div>
      <select id="global-event" class="global-event" aria-label="Event" hidden></select>
    </header>

    <main class="content">
     <div id="tab-overview">
      <div class="head">
        <div class="grow"><div class="eyebrow" id="ov-date"></div><h1 id="ov-greeting"></h1><p class="sub" data-t="ovSub"></p></div>
      </div>
      <div id="ov-attention" class="attention"></div>
      <div id="ov-tiles" class="stat-strip"></div>
      <div class="ov-grid">
        <section><div class="section-h"><h2 data-t="ovUpcoming"></h2><button class="link" type="button" data-goto="events" data-t="ovAllEvents"></button></div><div id="ov-events" class="card flush"></div></section>
        <section id="ov-activity-wrap"><div class="section-h"><h2 data-t="ovRecent"></h2><button class="link" type="button" data-goto="activity" data-t="ovViewAll"></button></div><div id="ov-activity" class="card flush"></div></section>
      </div>
     </div>

     <div id="tab-members" hidden>
      <div class="head"><div class="grow"><h1 data-t="tabMembers"></h1><p class="sub" data-t="membersSub"></p></div>
        <button id="add-member-button" class="primary small-button" type="button" data-t="addMember"></button></div>
      <div id="mem-list-area">
      <div class="mem-views">
        <div class="chips" id="mem-filters">
          <button class="chip" type="button" data-mem-view="pending"><span data-t="pendingTab"></span> <span id="mem-pending-count" class="chip-count"></span></button>
          <button class="chip active" type="button" data-mem-view="search" data-t="searchTab"></button>
        </div>
        <button id="pending-refresh" class="link small" type="button" data-t="pendingRefresh"></button>
      </div>
      <section id="pending-view" hidden>
        <p id="pending-status" class="muted small" aria-live="polite"></p>
        <ul id="pending-list" class="results"></ul>
        <button id="pending-more" class="secondary" type="button" hidden></button>
        <p class="muted small" data-t="pendingNote"></p>
      </section>
      <section id="search-view">
        <label for="search-input" class="visually-hidden" data-t="searchLabel"></label>
        <input id="search-input" class="search" type="search" autocomplete="off" enterkeyhint="search">
        <p id="search-status" class="muted small" aria-live="polite"></p>
        <ul id="results" class="results"></ul>
      </section>
      <section id="partners-section" class="detail-block">
        <div class="row-between"><h3 class="section-title" data-t="partnersHeading"></h3><button id="partner-add" class="link" type="button" data-t="partnerAdd"></button></div>
        <p class="muted small" data-t="partnersHint"></p>
        <ul id="partners-list" class="plain-list partner-list"></ul>
        <div class="row-between"><h4 class="section-title" data-t="redeemHeading"></h4><button id="redeem-csv" class="link" type="button" data-t="redeemCsv"></button></div>
        <p class="muted small" data-t="redeemHint"></p>
        <p id="redeem-status" class="muted small" aria-live="polite"></p>
        <ul id="redeem-list" class="plain-list"></ul>
      </section>
      </div>

      <section id="member-view" hidden>
        <button id="back-button" class="link" data-t="back"></button>
        <article class="card member-card">
          <h2 id="member-name"></h2>
          <div id="member-badges" class="badges"></div>
          <dl id="member-fields" class="fields"></dl>
          <div id="member-history" class="detail-block"></div>
          <div class="button-row">
            <button id="member-edit-button" class="secondary small-button" type="button" data-t="editMember"></button>
            <button id="member-resend-pass" class="secondary small-button" type="button" data-t="resendPass" hidden></button>
          </div>
          <div id="member-pay" class="member-pay" hidden>
            <p class="muted small" data-t="markPayNote"></p>
            <button id="member-mark-paid" class="primary" type="button" data-t="markPaid"></button>
            <p id="member-pay-error" class="error" role="alert" hidden></p>
          </div>
        </article>
        <p class="muted small" data-t="readOnlyNote"></p>
      </section>
     </div>

     <div id="tab-events" hidden>
      <section id="events-list-view">
        <div class="head">
          <div class="grow"><h1 data-t="eventsTitle"></h1><p class="sub" data-t="eventsSub"></p></div>
          <button id="new-event-button" class="primary small-button" data-t="newEvent"></button>
        </div>
        <p id="events-status" class="muted small" aria-live="polite"></p>
        <ul id="events-list" class="results"></ul>
        <button id="toggle-archived" class="link small" hidden></button>
      </section>

      <section id="event-detail-view" hidden>
        <button id="detail-back-button" class="link" data-t="backToEvents"></button>
        <div class="row-between">
          <h2 id="detail-title" class="section-title"></h2>
          <button id="detail-refresh" class="link" data-t="refreshed"></button>
          <button id="detail-report" class="link" data-t="eventReport"></button>
          <button id="detail-csv" class="link" data-t="attDownload"></button>
        </div>
        <p id="detail-status" class="muted small" aria-live="polite"></p>
        <p id="detail-archived" class="notice-box" hidden></p>
        <div id="detail-tiles" class="tiles"></div>
        <div id="detail-types" class="detail-block"></div>
        <div id="detail-questions" class="detail-block"></div>
        <div id="detail-feedback" class="detail-block"></div>
        <h3 class="section-title" data-t="attendeesTitle"></h3>
        <input id="att-search" class="search" type="search" autocomplete="off">
        <div class="row-between att-tools">
          <div class="chips" id="att-filters">
            <button class="chip active" data-filter="active" data-t="attFilterActive"></button>
            <button class="chip" data-filter="paid" data-t="attFilterPaid"></button>
            <button class="chip" data-filter="awaiting" data-t="attFilterAwaiting"></button>
            <button class="chip" data-filter="inside" data-t="attFilterInside"></button>
            <button class="chip" data-filter="notArrived" data-t="attFilterNotArrived"></button>
            <button class="chip" data-filter="flagged" data-t="attFilterFlagged"></button>
            <button class="chip" data-filter="closed" data-t="attFilterClosed"></button>
            <button class="chip" data-filter="all" data-t="attFilterAll"></button>
          </div>
          <select id="att-sort" class="att-sort">
            <option value="name" data-t="attSortName"></option>
            <option value="type" data-t="attSortType"></option>
            <option value="newest" data-t="attSortNewest"></option>
          </select>
        </div>
        <p id="att-count" class="muted small"></p>
        <ul id="att-list" class="results"></ul>
        <button id="att-more" class="secondary" type="button" data-t="loadMore" hidden></button>
      </section>

      <section id="event-editor-view" hidden>
        <button id="editor-back-button" class="link" data-t="backToEvents"></button>
        <div class="editor-layout">
        <nav class="steps" id="ed-steps" aria-label="Event sections">
          <button type="button" class="on" data-step="p-basics" data-t="edBasics"></button>
          <button type="button" data-step="p-when" data-t="edSchedule"></button>
          <button type="button" data-step="p-cap" data-t="edCapacity"></button>
          <button type="button" data-step="p-tix" data-t="evTickets"></button>
          <button type="button" data-step="p-reg" data-t="edRegistration"></button>
          <button type="button" data-step="p-pub" data-t="edPublishing"></button>
        </nav>
        <form id="event-form" class="editor-form" novalidate>
          <div class="head tight"><div class="grow"><h2 id="editor-title" class="page-title"></h2><p id="editor-hint" class="muted small" hidden></p></div></div>

          <section class="card panel" id="p-basics">
            <header><h3 data-t="edBasics"></h3><p data-t="edBasicsHint"></p></header>
            <div class="inner">
              <div><label for="ev-name" data-t="evName"></label>
              <input id="ev-name" required maxlength="120"></div>
              <div><label data-t="evImage"></label>
              <div class="image-picker">
                <img id="ev-image-preview" alt="" hidden>
                <input id="ev-image-file" type="file" accept="image/jpeg,image/png,image/webp">
                <button type="button" id="ev-image-pick" class="link" data-t="pickPrevImage"></button>
                <div id="ev-image-grid" class="image-grid" hidden></div>
                <p id="ev-image-status" class="muted small"></p>
              </div></div>
              <div><label for="ev-description" data-t="evDescription"></label>
              <textarea id="ev-description" rows="6" maxlength="4000"></textarea></div>
            </div>
          </section>

          <section class="card panel" id="p-when">
            <header><h3 data-t="edSchedule"></h3><p data-t="edScheduleHint"></p></header>
            <div class="inner">
              <div class="grid-3">
                <div><label for="ev-date" data-t="evDate"></label><input id="ev-date" type="date" required></div>
                <div><label for="ev-start" data-t="evStart"></label><input id="ev-start" type="time"></div>
                <div><label for="ev-end" data-t="evEnd"></label><input id="ev-end" type="time"></div>
              </div>
              <div><label for="ev-location" data-t="evLocation"></label>
              <input id="ev-location" maxlength="150"></div>
            </div>
          </section>

          <section class="card panel" id="p-cap">
            <header><h3 data-t="edCapacity"></h3><p data-t="edCapacityHint"></p></header>
            <div class="inner">
              <div class="grid-2">
                <div><label for="ev-capacity" data-t="evCapacity"></label><input id="ev-capacity" type="number" min="0" inputmode="numeric"></div>
                <div><label for="ev-capacity-rule" data-t="evCapacityRule"></label>
                  <select id="ev-capacity-rule">
                    <option value="paid" data-t="evCapacityPaid"></option>
                    <option value="all" data-t="evCapacityAll"></option>
                  </select>
                </div>
              </div>
            </div>
          </section>

          <section class="card panel" id="p-waitlist">
            <header><h3 data-t="evWaitlist"></h3><p data-t="evWaitlistHint"></p></header>
            <div class="inner">
              <label class="check-row"><input id="ev-waitlist" type="checkbox"> <span data-t="evWaitlist"></span></label>
            </div>
          </section>

          <section class="card panel" id="p-tix">
            <header><h3 data-t="evTickets"></h3><p data-t="edTicketsHint"></p></header>
            <div class="inner">
              <div id="ev-ticket-types"></div>
              <div><button type="button" id="add-ticket-type" class="link" data-t="addTicketType"></button></div>
            </div>
          </section>

          <section class="card panel" id="p-reg">
            <header><h3 data-t="edRegistration"></h3><p data-t="evQuestionsHint"></p></header>
            <div class="inner">
              <div id="ev-questions"></div>
              <div><button type="button" id="add-question" class="link" data-t="addQuestion"></button></div>
              <div><label for="ev-closes" data-t="evCloses"></label>
              <input id="ev-closes" type="datetime-local">
              <p class="muted small" data-t="evClosesHint"></p></div>
            </div>
          </section>

          <section class="card panel" id="p-pub">
            <header><h3 data-t="edPublishing"></h3><p data-t="edPublishingHint"></p></header>
            <div class="inner">
              <div><label for="ev-code-prefix" data-t="evCodePrefix"></label>
              <input id="ev-code-prefix" maxlength="4" class="short">
              <p class="muted small" data-t="evCodePrefixHint"></p></div>
            </div>
          </section>

          <p id="editor-error" class="error" role="alert" hidden></p>
          <div class="savebar">
            <button type="button" id="editor-cancel" class="link" data-t="cancel"></button>
            <button type="submit" id="save-draft-button" class="secondary" data-t="saveDraft"></button>
            <button type="button" id="save-publish-button" class="primary" data-t="savePublish"></button>
          </div>
        </form>
        </div>
      </section>
     </div>
     <div id="tab-payments" hidden>
      <div class="head"><div class="grow"><h1 data-t="tabPayments"></h1><p class="sub" data-t="paySub"></p></div></div>
      <div class="payments-top">
        <label for="pay-event" class="visually-hidden" data-t="payEvent"></label>
        <select id="pay-event" class="tab-event-select"></select>
        <div id="pay-tiles" class="tiles pay-tiles"></div>
        <div class="row-between">
          <p id="pay-summary" class="muted small"></p>
          <span class="button-row">
            <button id="mail-all-button" class="secondary small-button" data-t="mailAll"></button>
            <button id="add-order-button" class="secondary small-button" data-t="addOrder"></button>
          </span>
        </div>
        <div id="pay-unsent" class="notice-box" hidden></div>
        <div id="pay-overdue" class="notice-box" hidden></div>
        <div class="chips" id="pay-filters">
          <button class="chip active" data-filter="awaiting" data-t="filterAwaiting"></button>
          <button class="chip" data-filter="overdue"></button>
          <button class="chip" data-filter="cancelreq" hidden></button>
          <button class="chip" data-filter="waitlist" hidden></button>
          <button class="chip" data-filter="paid" data-t="filterPaid"></button>
          <button class="chip" data-filter="closed" data-t="filterClosed"></button>
          <button class="chip" data-filter="all" data-t="filterAll"></button>
        </div>
        <input id="pay-search" class="search" type="search" autocomplete="off">
      </div>
      <div id="bulk-bar" class="bulk-bar" hidden></div>
      <p id="pay-status" class="muted small" aria-live="polite"></p>
      <div class="order-cols" aria-hidden="true"><span data-t="colOrder"></span><span data-t="colPayer"></span><span data-t="colPeople"></span><span data-t="colTotal"></span><span></span></div>
      <ul id="orders" class="results"></ul>
      <button id="orders-more" class="secondary" type="button" data-t="loadMore" hidden></button>
     </div>
     <div id="tab-door" hidden>
      <div class="head door-head">
        <div class="grow"><div class="eyebrow" data-t="doorEyebrow"></div><h1 data-t="tabDoor"></h1><p class="sub" data-t="doorSub"></p></div>
        <label for="door-event" class="visually-hidden" data-t="payEvent"></label>
        <select id="door-event" class="tab-event-select"></select>
      </div>

      <div class="entry-card" id="entry-card">
        <div class="entry-main">
          <span id="door-event-name" class="door-scanning"></span>
          <button id="entry-toggle" class="entry-toggle" type="button" aria-live="polite"></button>
          <span id="door-counts" class="muted small"></span>
          <span id="door-scanners-online" class="badge b-info" hidden><i></i><span id="scanners-count">0</span> <span id="scanners-word"></span></span>
        </div>
        <div class="door-live" aria-live="polite">
          <span class="door-live-num"><span id="live-inside">0</span> / <span id="live-total">0</span></span>
          <span class="door-live-label" data-t="liveInside"></span>
          <span id="live-sub" class="door-live-sub"></span>
        </div>
      </div>

      <div id="scan-result" class="scan-result idle" aria-live="assertive"></div>

      <div class="door-grid">
        <div class="door-left">
          <div class="card pad find-card">
            <div class="section-h"><h2 data-t="findTitle"></h2>
              <button id="walkin-button" class="secondary small-button" type="button" data-t="walkIn"></button></div>
            <form id="manual-form" class="manual">
              <input id="manual-input" type="search" autocomplete="off" enterkeyhint="search">
              <button type="submit" class="secondary" data-t="find"></button>
            </form>
            <ul id="manual-results" class="results"></ul>
          </div>

          <form id="walkin-form" class="card editor" hidden>
            <h2 data-t="walkInTitle"></h2>
            <label for="wi-name" data-t="walkInName"></label>
            <input id="wi-name" maxlength="80" autocomplete="off">
            <label for="wi-ucid" data-t="walkInUcid"></label>
            <input id="wi-ucid" inputmode="numeric" maxlength="12" autocomplete="off">
            <fieldset><legend data-t="ticket"></legend><div id="wi-types"></div></fieldset>
            <div id="wi-member" hidden>
              <label for="wi-member-id" data-t="walkInMemberId"></label>
              <input id="wi-member-id" maxlength="20" autocomplete="off" placeholder="CSS…">
            </div>
            <fieldset><legend data-t="walkInPaidBy"></legend>
              <label class="check"><input type="radio" name="wi-method" value="cash" checked> <span data-t="cash"></span></label>
