<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>CSS Exec Portal</title>
  <link rel="stylesheet" href="styles.css?v=0.3.1">
</head>
<body>
  <div id="demo-banner" class="demo-banner" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="connection-notice" class="connection-notice" role="status" hidden></div>

  <!-- Sign-in -->
  <main id="login-view" class="login" hidden>
    <form id="login-form" class="card login-card" autocomplete="off">
      <h1 data-t="appTitle"></h1>
      <p class="muted" data-t="appSubtitle"></p>

      <label for="password" data-t="passwordLabel"></label>
      <input id="password" type="password" autocomplete="current-password" required>

      <label for="name-input" data-t="nameLabel"></label>
      <input id="name-input" type="text" autocomplete="name" required>

      <p id="login-error" class="error" role="alert" hidden></p>
      <button id="login-button" type="submit" class="primary" data-t="signIn"></button>
    </form>
  </main>

  <!-- Portal -->
  <div id="app-view" hidden>
    <header class="topbar">
      <div class="brand" data-t="appTitle"></div>
      <div class="who">
        <span class="muted" data-t="signedInAs"></span> <strong id="who-name"></strong>
        <span id="admin-badge" class="pill good" data-t="roleAdmin" hidden></span>
        <button id="logout-button" class="link" data-t="signOut"></button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="members" data-t="tabMembers"></button>
      <button class="tab" data-tab="events" data-t="tabEvents"></button>
      <button class="tab" data-tab="payments" data-t="tabPayments"></button>
      <button class="tab" data-tab="door" data-t="tabDoor"></button>
    </nav>

    <main class="content">
     <div id="tab-members">
      <section id="search-view">
        <label for="search-input" class="visually-hidden" data-t="searchLabel"></label>
        <input id="search-input" class="search" type="search" autocomplete="off" enterkeyhint="search">
        <p id="search-status" class="muted small" aria-live="polite"></p>
        <ul id="results" class="results"></ul>
      </section>

      <section id="member-view" hidden>
        <button id="back-button" class="link" data-t="back"></button>
        <article class="card member-card">
          <h2 id="member-name"></h2>
          <div id="member-badges" class="badges"></div>
          <dl id="member-fields" class="fields"></dl>
        </article>
        <p class="muted small" data-t="readOnlyNote"></p>
      </section>
     </div>

     <div id="tab-events" hidden>
      <section id="events-list-view">
        <div class="row-between">
          <h2 class="section-title" data-t="eventsTitle"></h2>
          <button id="new-event-button" class="primary small-button" data-t="newEvent"></button>
        </div>
        <p id="events-status" class="muted small" aria-live="polite"></p>
        <ul id="events-list" class="results"></ul>
        <button id="toggle-archived" class="link small" hidden></button>
      </section>

      <section id="event-detail-view" hidden>
        <button id="detail-back-button" class="link" data-t="backToEvents"></button>
        <div class="row-between">
          <h2 id="detail-title" class="section-title"></h2>
          <button id="detail-refresh" class="link" data-t="refreshed"></button>
        </div>
        <p id="detail-status" class="muted small" aria-live="polite"></p>
        <div id="detail-tiles" class="tiles"></div>
        <div id="detail-types" class="detail-block"></div>
        <div id="detail-questions" class="detail-block"></div>
        <h3 class="section-title" data-t="attendeesTitle"></h3>
        <input id="att-search" class="search" type="search" autocomplete="off">
        <div class="row-between att-tools">
          <div class="chips" id="att-filters">
            <button class="chip active" data-filter="active" data-t="attFilterActive"></button>
            <button class="chip" data-filter="paid" data-t="attFilterPaid"></button>
            <button class="chip" data-filter="awaiting" data-t="attFilterAwaiting"></button>
            <button class="chip" data-filter="inside" data-t="attFilterInside"></button>
            <button class="chip" data-filter="notArrived" data-t="attFilterNotArrived"></button>
            <button class="chip" data-filter="flagged" data-t="attFilterFlagged"></button>
            <button class="chip" data-filter="closed" data-t="attFilterClosed"></button>
            <button class="chip" data-filter="all" data-t="attFilterAll"></button>
          </div>
          <select id="att-sort" class="att-sort">
            <option value="name" data-t="attSortName"></option>
            <option value="type" data-t="attSortType"></option>
            <option value="newest" data-t="attSortNewest"></option>
          </select>
        </div>
        <p id="att-count" class="muted small"></p>
        <ul id="att-list" class="results"></ul>
      </section>

      <section id="event-editor-view" hidden>
        <button id="editor-back-button" class="link" data-t="backToEvents"></button>
        <form id="event-form" class="card editor" novalidate>
          <h2 id="editor-title"></h2>
          <p id="editor-hint" class="muted small" hidden></p>

          <label for="ev-name" data-t="evName"></label>
          <input id="ev-name" required maxlength="120">

          <label data-t="evImage"></label>
          <div class="image-picker">
            <img id="ev-image-preview" alt="" hidden>
            <input id="ev-image-file" type="file" accept="image/jpeg,image/png,image/webp">
            <p id="ev-image-status" class="muted small"></p>
          </div>

          <div class="grid-3">
            <div><label for="ev-date" data-t="evDate"></label><input id="ev-date" type="date" required></div>
            <div><label for="ev-start" data-t="evStart"></label><input id="ev-start" type="time"></div>
            <div><label for="ev-end" data-t="evEnd"></label><input id="ev-end" type="time"></div>
          </div>

          <label for="ev-location" data-t="evLocation"></label>
          <input id="ev-location" maxlength="150">

          <label for="ev-description" data-t="evDescription"></label>
          <textarea id="ev-description" rows="6" maxlength="4000"></textarea>

          <div class="grid-2">
            <div><label for="ev-capacity" data-t="evCapacity"></label><input id="ev-capacity" type="number" min="0" inputmode="numeric"></div>
            <div><label for="ev-capacity-rule" data-t="evCapacityRule"></label>
              <select id="ev-capacity-rule">
                <option value="paid" data-t="evCapacityPaid"></option>
                <option value="all" data-t="evCapacityAll"></option>
              </select>
            </div>
          </div>

          <fieldset>
            <legend data-t="evTickets"></legend>
            <div id="ev-ticket-types"></div>
            <button type="button" id="add-ticket-type" class="link" data-t="addTicketType"></button>
          </fieldset>

          <fieldset>
            <legend data-t="evQuestions"></legend>
            <p class="muted small" data-t="evQuestionsHint"></p>
            <div id="ev-questions"></div>
            <button type="button" id="add-question" class="link" data-t="addQuestion"></button>
          </fieldset>

          <label for="ev-closes" data-t="evCloses"></label>
          <input id="ev-closes" type="datetime-local">
          <p class="muted small" data-t="evClosesHint"></p>

          <label for="ev-code-prefix" data-t="evCodePrefix"></label>
          <input id="ev-code-prefix" maxlength="4" class="short">
          <p class="muted small" data-t="evCodePrefixHint"></p>

          <p id="editor-error" class="error" role="alert" hidden></p>
          <div class="button-row">
            <button type="submit" id="save-draft-button" class="secondary" data-t="saveDraft"></button>
            <button type="button" id="save-publish-button" class="primary" data-t="savePublish"></button>
          </div>
        </form>
      </section>
     </div>
     <div id="tab-payments" hidden>
      <div class="payments-top">
        <label for="pay-event" class="visually-hidden" data-t="payEvent"></label>
        <select id="pay-event"></select>
        <div class="row-between">
          <p id="pay-summary" class="muted small"></p>
          <button id="add-order-button" class="secondary small-button" data-t="addOrder"></button>
        </div>
        <div id="pay-unsent" class="notice-box" hidden></div>
        <div id="pay-overdue" class="notice-box" hidden></div>
        <div class="chips" id="pay-filters">
          <button class="chip active" data-filter="awaiting" data-t="filterAwaiting"></button>
          <button class="chip" data-filter="overdue"></button>
          <button class="chip" data-filter="paid" data-t="filterPaid"></button>
          <button class="chip" data-filter="closed" data-t="filterClosed"></button>
          <button class="chip" data-filter="all" data-t="filterAll"></button>
        </div>
        <input id="pay-search" class="search" type="search" autocomplete="off">
      </div>
      <div id="bulk-bar" class="bulk-bar" hidden></div>
      <p id="pay-status" class="muted small" aria-live="polite"></p>
      <ul id="orders" class="results"></ul>
     </div>
     <div id="tab-door" hidden>
      <div class="door-top">
        <div class="door-live" aria-live="polite">
          <span class="door-live-num"><span id="live-inside">0</span> / <span id="live-total">0</span></span>
          <span class="door-live-label" data-t="liveInside"></span>
          <span id="live-sub" class="door-live-sub"></span>
        </div>
        <label for="door-event" class="visually-hidden" data-t="payEvent"></label>
        <select id="door-event"></select>
        <div class="row-between">
          <button id="entry-toggle" class="entry-toggle"></button>
          <span id="door-counts" class="muted small"></span>
        </div>
      </div>

      <div id="scan-result" class="scan-result idle" aria-live="assertive"></div>
      <div id="camera" class="camera" hidden></div>

      <div class="door-buttons">
        <button id="camera-toggle" class="primary" data-t="startCamera"></button>
        <button id="walkin-button" class="secondary" data-t="walkIn"></button>
      </div>

      <form id="walkin-form" class="card editor" hidden>
        <h2 data-t="walkInTitle"></h2>
        <label for="wi-name" data-t="walkInName"></label>
        <input id="wi-name" maxlength="80" autocomplete="off">
        <label for="wi-ucid" data-t="walkInUcid"></label>
        <input id="wi-ucid" inputmode="numeric" maxlength="12" autocomplete="off">
        <fieldset><legend data-t="ticket"></legend><div id="wi-types"></div></fieldset>
        <div id="wi-member" hidden>
          <label for="wi-member-id" data-t="walkInMemberId"></label>
          <input id="wi-member-id" maxlength="20" autocomplete="off" placeholder="CSS…">
        </div>
        <fieldset><legend data-t="walkInPaidBy"></legend>
          <label class="check"><input type="radio" name="wi-method" value="cash" checked> <span data-t="cash"></span></label>
          <label class="check"><input type="radio" name="wi-method" value="etransfer"> <span data-t="etransfer"></span></label>
        </fieldset>
        <p id="wi-error" class="error" hidden></p>
        <div class="button-row">
          <button type="button" id="wi-cancel" class="secondary" data-t="cancel"></button>
          <button type="submit" id="wi-submit" class="primary" data-t="walkInSubmit"></button>
        </div>
      </form>

      <details id="recent-box" class="helpdesk" open>
        <summary id="recent-title"></summary>
        <ul id="recent-list" class="results"></ul>
      </details>

      <form id="manual-form" class="manual">
        <input id="manual-input" type="search" autocomplete="off" enterkeyhint="search">
        <button type="submit" class="secondary" data-t="find"></button>
      </form>
      <ul id="manual-results" class="results"></ul>

      <details id="unpaid-box" class="helpdesk" open>
        <summary id="unpaid-title"></summary>
        <ul id="helpdesk-unpaid" class="results"></ul>
      </details>
      <details id="flagged-box" class="helpdesk">
        <summary id="flagged-title"></summary>
        <ul id="helpdesk-flagged" class="results"></ul>
      </details>
     </div>
    </main>
  </div>

  <!-- Add a paid registration -->
  <dialog id="add-dialog" class="edit-dialog">
    <form id="add-form" class="editor" novalidate>
      <h2 id="add-title"></h2>
      <p class="muted small" data-t="addHint"></p>
      <label for="add-name" data-t="editName"></label>
      <input id="add-name" maxlength="80" autocomplete="off">
      <label for="add-email" data-t="editEmail"></label>
      <input id="add-email" type="email" maxlength="120" autocomplete="off">
      <p class="muted small" data-t="addEmailHint"></p>
      <label for="add-type" data-t="editType"></label>
      <select id="add-type"></select>
      <div class="grid-2">
        <div><label for="add-ucid" data-t="walkInUcid"></label><input id="add-ucid" inputmode="numeric" maxlength="12" autocomplete="off"></div>
        <div><label for="add-member" data-t="walkInMemberId"></label><input id="add-member" maxlength="20" autocomplete="off"></div>
      </div>
      <div id="add-answers"></div>
      <label for="add-etransfer" data-t="editEtransferName"></label>
      <input id="add-etransfer" maxlength="80" autocomplete="off">
      <label for="add-notes" data-t="editNotes"></label>
      <input id="add-notes" maxlength="200" autocomplete="off">
      <p id="add-error" class="error" role="alert" hidden></p>
      <div class="button-row">
        <button type="button" id="add-cancel" class="secondary" data-t="cancel"></button>
        <button type="submit" id="add-save" class="primary" data-t="addSave"></button>
      </div>
    </form>
  </dialog>

  <!-- Edit person -->
  <dialog id="edit-dialog" class="edit-dialog">
    <form id="edit-form" class="editor" novalidate>
      <h2 data-t="editTitle"></h2>
      <p id="edit-who" class="muted small"></p>

      <label for="ed-name" data-t="editName"></label>
      <input id="ed-name" maxlength="80" autocomplete="off">
      <label for="ed-email" data-t="editEmail"></label>
      <input id="ed-email" type="email" maxlength="120" autocomplete="off">
      <p class="muted small" data-t="editEmailHint"></p>

      <p id="edit-locked" class="muted small" hidden data-t="editAdminLocked"></p>

      <div id="edit-admin" hidden>
        <fieldset>
          <legend data-t="editAdminTitle"></legend>
          <div class="grid-2">
            <div><label for="ed-ucid" data-t="editUcid"></label><input id="ed-ucid" inputmode="numeric" maxlength="12" autocomplete="off"></div>
            <div><label for="ed-member" data-t="editMemberId"></label><input id="ed-member" maxlength="20" autocomplete="off"></div>
          </div>
          <label for="ed-type" data-t="editType"></label>
          <select id="ed-type"></select>
          <p class="muted small" data-t="editMemberHint"></p>
          <label for="ed-flag" data-t="editFlag"></label>
          <input id="ed-flag" maxlength="200" autocomplete="off">
          <p class="muted small" data-t="editFlagHint"></p>
          <div id="ed-answers"></div>
        </fieldset>
        <fieldset>
          <legend id="ed-order-title"></legend>
          <label for="ed-payer-name" data-t="editPayerName"></label>
          <input id="ed-payer-name" maxlength="80" autocomplete="off">
          <label for="ed-payer-email" data-t="editPayerEmail"></label>
          <input id="ed-payer-email" type="email" maxlength="120" autocomplete="off">
          <label for="ed-etransfer" data-t="editEtransferName"></label>
          <input id="ed-etransfer" maxlength="80" autocomplete="off">
          <label for="ed-notes" data-t="editNotes"></label>
          <input id="ed-notes" maxlength="400" autocomplete="off">
        </fieldset>
      </div>

      <p id="edit-error" class="error" role="alert" hidden></p>
      <div class="button-row">
        <button type="button" id="edit-cancel" class="secondary" data-t="cancel"></button>
        <button type="submit" id="edit-save" class="primary" data-t="editSave"></button>
      </div>
    </form>
  </dialog>

  <script src="config.js?v=0.2.4"></script>
  <script src="strings.js?v=0.3.1"></script>
  <script src="mock.js?v=0.2.4"></script>
  <script src="app.js?v=0.3.0"></script>
  <script src="events.js?v=0.3.0"></script>
  <script src="payments.js?v=0.3.1"></script>
  <script src="edit.js?v=0.3.0"></script>
  <script src="finance.js?v=0.3.1"></script>
  <script src="attendees.js?v=0.3.0"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="door.js?v=0.3.0"></script>
</body>
</html>
