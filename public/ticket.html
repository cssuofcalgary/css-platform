<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#3b4237">
  <meta name="robots" content="noindex">
  <title>Your ticket &middot; CSS</title>
  <link rel="icon" type="image/png" href="assets/top_panda.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="public.css?v=1.4.1">
</head>
<body>
  <div class="app-container">
    <a href="./" class="top-banner-link" aria-label="CSS events home">
      <img class="top-banner" src="https://lh3.googleusercontent.com/d/1L7oECAmAo6UewHXIeJAH6TrUG0lSXTlq" alt="Chinese Students' Society"
           onerror="this.onerror=null;this.src='assets/css-logo.png';this.classList.add('fallback')">
    </a>

    <div class="card-wrapper">
      <img src="assets/top_panda.png" class="panda top-panda" alt="">
      <main id="page" class="card">
        <div class="wave-loader" role="status" aria-live="polite"><div class="bamboo-wave" aria-hidden="true"><svg class="bamboo" viewBox="0 0 40 80" aria-hidden="true"><rect x="8" y="0" width="12" height="80" rx="6" fill="#7aa356"/><rect x="11" y="0" width="3" height="80" rx="1.5" fill="#a9cf82"/><rect x="7" y="22" width="14" height="4" rx="2" fill="#4c6b47"/><rect x="7" y="52" width="14" height="4" rx="2" fill="#4c6b47"/><path d="M20 24 Q31 12 38 19 Q29 27 20 24Z" fill="#6f9a4a"/></svg><svg class="bamboo" viewBox="0 0 40 80" aria-hidden="true"><rect x="8" y="0" width="12" height="80" rx="6" fill="#7aa356"/><rect x="11" y="0" width="3" height="80" rx="1.5" fill="#a9cf82"/><rect x="7" y="22" width="14" height="4" rx="2" fill="#4c6b47"/><rect x="7" y="52" width="14" height="4" rx="2" fill="#4c6b47"/><path d="M20 24 Q31 12 38 19 Q29 27 20 24Z" fill="#6f9a4a"/></svg><svg class="bamboo" viewBox="0 0 40 80" aria-hidden="true"><rect x="8" y="0" width="12" height="80" rx="6" fill="#7aa356"/><rect x="11" y="0" width="3" height="80" rx="1.5" fill="#a9cf82"/><rect x="7" y="22" width="14" height="4" rx="2" fill="#4c6b47"/><rect x="7" y="52" width="14" height="4" rx="2" fill="#4c6b47"/><path d="M20 24 Q31 12 38 19 Q29 27 20 24Z" fill="#6f9a4a"/></svg></div><p class="muted center pulse" data-t="loading"></p></div>
      </main>
      <img src="assets/bottom_panda.png" class="panda bottom-panda" alt="">
    </div>

    <footer class="website-footer">
      <p><span data-t="contact"></span> <a id="contact-link"></a> &middot; <a id="instagram-link" target="_blank" rel="noopener" data-t="instagram"></a></p>
      <p>Go to our <a href="https://ucalgarycss.ca/" target="_blank" rel="noopener">website</a> &middot; <a href="https://member.ucalgarycss.ca/" target="_blank" rel="noopener">Member pass</a> &middot; <a href="tickets.html">My tickets</a></p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="config.js?v=0.3.0"></script>
  <script src="strings.js?v=1.1.0"></script>
  <script src="ticket.js?v=1.0.1"></script>
</body>
</html>
