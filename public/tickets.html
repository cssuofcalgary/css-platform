<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#3b4237">
  <meta name="robots" content="noindex">
  <title>Find my tickets &middot; CSS</title>
  <link rel="icon" type="image/png" href="assets/top_panda.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="public.css?v=1.8.0">
</head>
<body>
  <div class="app-container">
    <a href="./" class="top-banner-link" aria-label="CSS events home">
      <img class="top-banner" src="https://lh3.googleusercontent.com/d/1L7oECAmAo6UewHXIeJAH6TrUG0lSXTlq" alt="Chinese Students' Society"
           onerror="this.onerror=null;this.src='assets/css-logo.png';this.classList.add('fallback')">
    </a>

    <div class="card-wrapper">
      <img src="assets/top_panda.png" class="panda top-panda" alt="">
      <main id="page" class="card">
        <a class="back" href="./" data-t="allEvents"></a>

        <section id="my-list" hidden>
          <h1 class="page-title" data-t="myTicketsTitle"></h1>
          <p id="my-hello" class="muted center"></p>
          <ul id="my-cards" class="ticket-list"></ul>
          <p class="center"><button type="button" id="my-forget" class="link-button" data-t="myTicketsForget"></button></p>
        </section>

        <div id="find-block">
        <h1 class="page-title" data-t="findTitle"></h1>
        <p class="muted center" data-t="findIntro"></p>

        <form id="find-email" class="register-form" novalidate>
          <div>
            <label for="f-email" data-t="findEmail"></label>
            <input id="f-email" type="email" autocomplete="email" inputmode="email" maxlength="120">
          </div>
          <button class="register" type="submit" data-t="findSend"></button>
        </form>

        <p class="center"><button type="button" id="forgot" class="link-button" data-t="findForgot"></button></p>

        <form id="find-ucid" class="register-form" novalidate hidden>
          <div>
            <label for="f-ucid" data-t="findUcid"></label>
            <input id="f-ucid" type="text" inputmode="numeric" autocomplete="off" maxlength="12">
            <label for="f-last" data-t="findLast"></label>
            <input id="f-last" type="text" autocomplete="family-name" maxlength="60">
          </div>
          <button class="register" type="submit" data-t="findSendUcid"></button>
        </form>

        <p id="find-result" class="notice" role="status" aria-live="polite" hidden></p>
        <p class="hint center" data-t="findHelp"></p>
        </div>
      </main>
      <img src="assets/bottom_panda.png" class="panda bottom-panda" alt="">
    </div>

    <footer class="website-footer">
      <p><span data-t="contact"></span> <a id="contact-link"></a> &middot; <a id="instagram-link" target="_blank" rel="noopener" data-t="instagram"></a></p>
      <p>Go to our <a href="https://ucalgarycss.ca/" target="_blank" rel="noopener">website</a> &middot; <a href="https://member.ucalgarycss.ca/" target="_blank" rel="noopener">Member pass</a></p>
    </footer>
  </div>

  <script src="config.js?v=0.3.0"></script>
  <script src="strings.js?v=1.8.0"></script>
  <script src="tickets.js?v=1.0.0"></script>
</body>
</html>
