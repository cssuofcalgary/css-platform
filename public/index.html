<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#3b4237">
  <title>CSS Events</title>
  <meta name="description" content="Events by the Chinese Students' Society at the University of Calgary.">
  <link rel="icon" type="image/png" href="assets/top_panda.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="public.css?v=1.4.0">
</head>
<body>
  <div class="app-container">
    <a href="./" class="top-banner-link" aria-label="CSS events home">
      <img class="top-banner" src="https://lh3.googleusercontent.com/d/1L7oECAmAo6UewHXIeJAH6TrUG0lSXTlq" alt="Chinese Students' Society"
           onerror="this.onerror=null;this.src='assets/css-logo.png';this.classList.add('fallback')">
    </a>

    <div class="card-wrapper">
      <img src="assets/top_panda.png" class="panda top-panda" alt="">
      <main id="page" class="card">
        <div class="panda-loader" role="status" aria-live="polite"><div class="panda-roll"><svg class="panda-ball" viewBox="0 0 100 100" aria-hidden="true"><circle cx="24" cy="24" r="13" fill="#2a2520"/><circle cx="76" cy="24" r="13" fill="#2a2520"/><circle cx="50" cy="54" r="40" fill="#fff" stroke="#2a2520" stroke-width="3"/><ellipse cx="34" cy="50" rx="9" ry="12" transform="rotate(25 34 50)" fill="#2a2520"/><ellipse cx="66" cy="50" rx="9" ry="12" transform="rotate(-25 66 50)" fill="#2a2520"/><circle cx="35" cy="49" r="3.5" fill="#fff"/><circle cx="65" cy="49" r="3.5" fill="#fff"/><ellipse cx="50" cy="63" rx="5.5" ry="4" fill="#2a2520"/><path d="M44 70 Q50 76 56 70" fill="none" stroke="#2a2520" stroke-width="2.5" stroke-linecap="round"/></svg><span class="panda-shadow"></span></div><p class="muted center pulse" data-t="loading"></p></div>
      </main>
      <img src="assets/bottom_panda.png" class="panda bottom-panda" alt="">
    </div>

    <footer class="website-footer">
      <p><span data-t="contact"></span> <a id="contact-link"></a> &middot; <a id="instagram-link" target="_blank" rel="noopener" data-t="instagram"></a></p>
      <p>Go to our <a href="https://ucalgarycss.ca/" target="_blank" rel="noopener">website</a> &middot; <a href="https://member.ucalgarycss.ca/" target="_blank" rel="noopener">Member pass</a> &middot; <a href="tickets.html">My tickets</a></p>
      <p class="privacy" data-t="privacy"></p>
    </footer>
  </div>

  <script src="config.js?v=0.3.0"></script>
  <script src="strings.js?v=1.1.0"></script>
  <script src="public.js?v=1.4.0"></script>
</body>
</html>
